   JAY SQUARED (J²)  —  a blocky 2D platformer
   Part 1: constants, math helpers, input, audio, tile definitions, textures

/* --- tiny math ----------------------------------------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => v < 0 ? -1 : v > 0 ? 1 : 0;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* stable per-coordinate hash, used for block texture variety */
function hash2(x, y) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function isPerfectSquare(n) {
  if (n < 0) return false;
  const r = Math.round(Math.sqrt(n));
  return r * r === n;
}

/* --- input --------------------------------------------------------------- */
const Keys = {
  down: new Set(),
  pressed: new Set(),
  released: new Set(),
  anyTyped: [],
  shiftHeld: false,
  shiftUsed: false,   // was Shift part of a combo (like Shift+/ for "?")
  shiftTap: false,    // Shift pressed and released on its own
  isDown(...codes) { return codes.some(c => this.down.has(c)); },
  justPressed(...codes) { return codes.some(c => this.pressed.has(c)); },
  endFrame() {
    this.pressed.clear(); this.released.clear();
    this.anyTyped.length = 0; this.shiftTap = false;
  },
};
const isShift = (c) => c === 'ShiftLeft' || c === 'ShiftRight';

const BLOCKED_KEYS = new Set([
  'Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
  'KeyQ', 'KeyE', 'KeyW', 'KeyA', 'KeyS', 'KeyD',
  'Digit0', 'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Slash',
  'Numpad0', 'Numpad1', 'Numpad2', 'Numpad3', 'Numpad4', 'Numpad5',
  'Numpad6', 'Numpad7', 'Numpad8', 'Numpad9', 'NumpadEnter',
  'ShiftLeft', 'ShiftRight',
]);

/* 0-9 from either the top row or the number pad. Reading e.code rather than
   e.key means the pad works whether or not Num Lock is on. */
function digitFromCode(code) {
  if (code.length === 6 && code.startsWith('Digit')) {
    const n = code.charCodeAt(5) - 48;
    return n >= 0 && n <= 9 ? n : null;
  }
  if (code.length === 7 && code.startsWith('Numpad')) {
    const n = code.charCodeAt(6) - 48;
    return n >= 0 && n <= 9 ? n : null;
  }
  return null;
}

addEventListener('keydown', (e) => {
  if (BLOCKED_KEYS.has(e.code)) e.preventDefault();
  if (!e.repeat) {
    Keys.pressed.add(e.code);
    Keys.anyTyped.push(e.key);
    if (isShift(e.code)) { Keys.shiftHeld = true; Keys.shiftUsed = false; }
    else if (Keys.shiftHeld) Keys.shiftUsed = true;   // Shift is modifying, not cycling
  }
  Keys.down.add(e.code);
  Audio2.unlock();
}, { passive: false });

addEventListener('keyup', (e) => {
  if (BLOCKED_KEYS.has(e.code)) e.preventDefault();
  if (isShift(e.code)) {
    // a clean tap cycles the inventory; Shift+"/" for help must not
    if (!Keys.shiftUsed) Keys.shiftTap = true;
    Keys.shiftHeld = false;
  }
  Keys.down.delete(e.code);
  Keys.released.add(e.code);
}, { passive: false });

addEventListener('blur', () => {
  Keys.down.clear();
  Keys.shiftHeld = false; Keys.shiftUsed = false;
});

/* Named controls — arrows AND wasd, per spec. */

/* --- internationalization -------------------------------------------------
   TR(s) looks the English original up in the current language's table and
   falls back to s itself, so anything not yet translated (or intentionally
   left in English) just degrades to English instead of throwing or showing
   "undefined". TRF is the same idea for messages built from live numbers —
   keyed by an id rather than by English text, since the English text itself
   is never a fixed string. */
const LANGS = ['en', 'es', 'de'];
const LANG_NAME = { en: 'English', es: 'Español', de: 'Deutsch' };
const LANG_CODE = { en: 'EN', es: 'ES', de: 'DE' };
const LANG_STORAGE_KEY = 'jaySquaredLang';

function loadLang() {
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(q)) { saveLang(q); return q; }
  } catch (e) { /* malformed URL or no location.search */ }
  try {
    const v = localStorage.getItem(LANG_STORAGE_KEY);
    if (LANGS.includes(v)) return v;
  } catch (e) { /* file:// or privacy mode can throw on localStorage access */ }
  return 'en';
}
function saveLang(lang) {
  try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch (e) {}
}
/* keeps ?lang= in the address bar in sync with an in-game L press, so
   reloading, bookmarking or sharing the URL preserves the chosen language */
function syncLangURL(lang) {
  try {
    const url = new URL(location.href);
    url.searchParams.set('lang', lang);
    history.replaceState(null, '', url);
  } catch (e) { /* file:// or sandboxed iframes can restrict history API */ }
}

function TR(s) {
  if (G.lang === 'en') return s;
  const table = STRINGS[G.lang];
  return (table && table[s]) || s;
}
function TRF(key, ...args) {
  const entry = STRINGS_F[key];
  if (!entry) return '';
  const fn = entry[G.lang] || entry.en;
  return fn(...args);
}

/* --- audio: a very small square-wave blip synth --------------------------- */
const Audio2 = {
  ctx: null, master: null, on: true,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.16;
      this.master.connect(this.ctx.destination);
    } catch (err) { this.on = false; }
  },
  blip(freq = 440, dur = 0.08, type = 'square', vol = 1, slide = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.9 * vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur = 0.14, vol = 0.5) {
    if (!this.on || !this.ctx) return;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol * 0.5;
    s.connect(g); g.connect(this.master); s.start();
  },
  arp(notes, spacing = 0.06, type = 'square') {
    notes.forEach((f, i) => setTimeout(() => this.blip(f, 0.09, type, 0.8), i * spacing * 1000));
  },
};

/* --- baked block textures ------------------------------------------------ */
/* Each block type gets 4 pre-rendered 16x16 variants so a wall of stone
   doesn't look like wallpaper. Minecraft-ish speckle noise. */
const TEX = {};
function bakeTextures() {
  for (const id in TILEDEF) {
    const d = TILEDEF[id];
    if (+id === T.AIR) continue;
    const variants = [];
    for (let v = 0; v < 4; v++) {
      const c = document.createElement('canvas');
      c.width = TILE; c.height = TILE;
      const g = c.getContext('2d');
      g.fillStyle = d.base;
      g.fillRect(0, 0, TILE, TILE);
      const rnd = mulberry32((+id) * 977 + v * 131);
      const n = Math.floor(d.speckle * 46);
      for (let i = 0; i < n; i++) {
        const x = Math.floor(rnd() * TILE), y = Math.floor(rnd() * TILE);
        const s = rnd() < 0.5 ? 1 : 2;
        g.fillStyle = rnd() < 0.55 ? d.shade : 'rgba(255,255,255,.08)';
        g.fillRect(x, y, s, s);
      }
      decorateTile(g, +id, rnd, d);
      variants.push(c);
    }
    TEX[id] = variants;
  }
}

function decorateTile(g, id, rnd, d) {
  switch (id) {
    case T.GRASS: {
      g.fillStyle = '#8a5a3b'; g.fillRect(0, 5, TILE, TILE - 5);
      g.fillStyle = '#6b432b';
      for (let i = 0; i < 18; i++) g.fillRect(Math.floor(rnd() * 16), 5 + Math.floor(rnd() * 11), 2, 1);
      g.fillStyle = d.base; g.fillRect(0, 0, TILE, 5);
      g.fillStyle = '#6ebd55';
      for (let i = 0; i < 10; i++) g.fillRect(Math.floor(rnd() * 16), Math.floor(rnd() * 4), 1, 1);
      g.fillStyle = '#3d7a2e';
      for (let x = 0; x < 16; x += 2) if (rnd() < 0.5) g.fillRect(x, 5, 2, 1);
      break;
    }
    case T.LOG: {
      g.fillStyle = '#5d4126';
      for (let y = 0; y < 16; y += 3) g.fillRect(0, y, 16, 1);
      g.fillStyle = '#8d6740'; g.fillRect(3, 0, 2, 16); g.fillRect(11, 0, 1, 16);
      break;
    }
    case T.LADDER: {
      g.clearRect(0, 0, TILE, TILE);
      g.fillStyle = '#8e6c3c'; g.fillRect(2, 0, 3, 16); g.fillRect(11, 0, 3, 16);
      g.fillStyle = '#c39a5f';
      g.fillRect(2, 0, 1, 16); g.fillRect(11, 0, 1, 16);
      for (let y = 2; y < 16; y += 5) { g.fillStyle = '#c39a5f'; g.fillRect(2, y, 12, 2); }
      break;
    }
    case T.VINE: {
      g.clearRect(0, 0, TILE, TILE);
      g.fillStyle = '#3f7f33';
      for (let y = 0; y < 16; y++) {
        const x = 6 + Math.round(Math.sin(y * 0.6) * 3);
        g.fillRect(x, y, 3, 1);
        if (rnd() < 0.3) g.fillRect(x - 2, y, 2, 1);
      }
      break;
    }
    case T.SPIKES: {
      g.clearRect(0, 0, TILE, TILE);
      for (let i = 0; i < 4; i++) {
        const bx = i * 4;
        g.fillStyle = '#b6bcc7';
        g.fillRect(bx + 1, 12, 3, 4); g.fillRect(bx + 1, 9, 2, 3); g.fillRect(bx + 1, 7, 1, 2);
        g.fillStyle = '#e2e7ee'; g.fillRect(bx + 1, 7, 1, 5);
      }
      break;
    }
    case T.CACTUS: {
      g.fillStyle = '#2d6a3a'; g.fillRect(0, 0, 2, 16); g.fillRect(14, 0, 2, 16);
      g.fillStyle = '#57a866';
      for (let y = 1; y < 16; y += 4) { g.fillRect(3, y, 1, 2); g.fillRect(12, y + 2, 1, 2); }
      break;
    }
    case T.BRICK: case T.DARKBRICK: {
      g.fillStyle = d.shade;
      g.fillRect(0, 7, 16, 1); g.fillRect(0, 15, 16, 1);
      g.fillRect(7, 0, 1, 8); g.fillRect(3, 8, 1, 8); g.fillRect(11, 8, 1, 8);
      break;
    }
    case T.PLANK: {
      g.fillStyle = '#96693a';
      g.fillRect(0, 3, 16, 1); g.fillRect(0, 8, 16, 1); g.fillRect(0, 13, 16, 1);
      g.fillStyle = '#d0a066'; g.fillRect(0, 4, 16, 1);
      break;
    }
    case T.PLATFORM: {
      g.clearRect(0, 0, TILE, TILE);
      g.fillStyle = '#c19b62'; g.fillRect(0, 0, 16, 5);
      g.fillStyle = '#96723f'; g.fillRect(0, 4, 16, 2);
      g.fillStyle = '#e0bd85'; g.fillRect(0, 0, 16, 1);
      break;
    }
    case T.GLASS: {
      g.clearRect(0, 0, TILE, TILE);
      g.fillStyle = 'rgba(180,220,245,.22)'; g.fillRect(0, 0, 16, 16);
      g.strokeStyle = 'rgba(225,245,255,.55)'; g.lineWidth = 1;
      g.strokeRect(0.5, 0.5, 15, 15);
      g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(2, 2, 5, 1); g.fillRect(2, 2, 1, 5);
      break;
    }
    case T.GLOWSTONE: {
      g.fillStyle = '#fff3c0';
      for (let i = 0; i < 10; i++) g.fillRect(Math.floor(rnd() * 14), Math.floor(rnd() * 14), 2, 2);
      break;
    }
    case T.COAL: {
      g.fillStyle = '#23232a';
      for (let i = 0; i < 6; i++) g.fillRect(3 + Math.floor(rnd() * 9), 3 + Math.floor(rnd() * 9), 3, 3);
      break;
    }
    case T.EMERALD: {
      g.fillStyle = '#31c66d';
      for (let i = 0; i < 4; i++) g.fillRect(3 + Math.floor(rnd() * 9), 3 + Math.floor(rnd() * 9), 3, 3);
      break;
    }
    case T.DOOR: {
      g.clearRect(0, 0, TILE, TILE);
      g.fillStyle = '#674325'; g.fillRect(1, 0, 14, 16);
      g.fillStyle = '#8b5f34'; g.fillRect(2, 1, 12, 14);
      g.fillStyle = '#5a3a20'; g.fillRect(2, 7, 12, 1);
      g.fillStyle = '#e8c04a'; g.fillRect(11, 8, 2, 2);
      break;
    }
    case T.TORCHWALL: {
      g.fillStyle = '#5a4526'; g.fillRect(7, 6, 2, 8);
      g.fillStyle = '#ffcf5a'; g.fillRect(6, 3, 4, 4);
      g.fillStyle = '#fff3c0'; g.fillRect(7, 4, 2, 2);
      break;
    }
    case T.ICE: {
      g.fillStyle = 'rgba(255,255,255,.45)';
      g.fillRect(2, 2, 6, 1); g.fillRect(9, 8, 5, 1); g.fillRect(3, 11, 4, 1);
      break;
    }
    case T.LEAVES: {
      g.fillStyle = 'rgba(0,0,0,.16)';
      for (let i = 0; i < 6; i++) g.fillRect(Math.floor(rnd() * 15), Math.floor(rnd() * 15), 2, 2);
      break;
    }
    case T.SHRUB: {
      g.clearRect(0, 0, TILE, TILE);
      g.fillStyle = '#3d7a2e';
      for (let i = 0; i < 7; i++) {
        const bx = 1 + Math.floor(rnd() * 13), bh = 3 + Math.floor(rnd() * 6);
        g.fillRect(bx, 16 - bh, 2, bh);
      }
      g.fillStyle = '#6ebd55';
      for (let i = 0; i < 5; i++) {
        const bx = 2 + Math.floor(rnd() * 12), bh = 3 + Math.floor(rnd() * 5);
        g.fillRect(bx, 16 - bh, 1, bh);
      }
      g.fillStyle = '#8fd86a';
      g.fillRect(4 + Math.floor(rnd() * 6), 8 + Math.floor(rnd() * 3), 2, 2);
      break;
    }
  }
}
/* ==========================================================================
   WORLD — biomes, seeded generation, the Cobalt Castle
   ========================================================================== */

const LEVELS = [
  {
    name: 'Emerald Plains', biome: 'plains', w: 210, h: 46, seed: 10501,
    item: 'earth', itemHint: 'behind the waterfall',
    sky: ['#6fb7f0', '#a9dcf7', '#d8f0fb'], fog: '#cfeafc', ambient: 1.0,
    mobs: ['slime', 'spikeling', 'pig', 'sheep', 'chicken'],
  },
  {
    name: 'Dripstone Deep', biome: 'cave', w: 210, h: 46, seed: 22711,
    item: 'water', itemHint: 'past the underground lake',
    sky: ['#101827', '#16202f', '#1b2736'], fog: '#0e1520', ambient: 0.52,
    mobs: ['slime', 'batty', 'spikeling', 'batty'],
  },
  {
    name: 'Sunburn Dunes', biome: 'desert', w: 210, h: 46, seed: 33377,
    item: 'electric', itemHint: 'atop the tallest dune',
    sky: ['#4fa3dd', '#9fcdea', '#f0dca8'], fog: '#f6e2b4', ambient: 1.0,
    mobs: ['spikeling', 'slime', 'batty'],
  },
  {
    name: 'Cinder Hollow', biome: 'volcanic', w: 210, h: 46, seed: 44909,
    item: 'lava', itemHint: 'over the magma sea',
    sky: ['#2a1016', '#48161a', '#6e2226'], fog: '#3a1418', ambient: 0.72,
    mobs: ['slime', 'batty', 'spikeling', 'spikeling'],
  },
  {
    name: 'The Cobalt Castle', biome: 'castle', w: 230, h: 46, seed: 55127,
    item: 'wind', itemHint: 'sealed in the heart of the keep',
    sky: ['#1d2547', '#2c3766', '#4a5590'], fog: '#232c52', ambient: 0.85,
    mobs: ['guardian', 'spikeling', 'batty', 'guardian'],
  },
];

class World {
  constructor(cfg, index) {
    this.cfg = cfg;
    this.index = index;
    this.w = cfg.w; this.h = cfg.h;
    this.biome = cfg.biome;
    this.tiles = new Uint8Array(this.w * this.h);
    this.surface = new Int16Array(this.w).fill(cfg.h - 12);
    this.spawn = { x: 6 * TILE, y: 10 * TILE };
    this.exit = { x: 0, y: 0 };
    this.itemSpots = [];
    this.gemSpots = [];
    this.runeSpots = [];
    this.mobSpots = [];
    this.hints = [];
    this.decor = [];
  }
  /* a live lookup rather than a copied field, so the HUD relabels itself the
     instant the language changes instead of waiting for the next level build */
  get name() { return TR(this.cfg.name); }
  idx(x, y) { return y * this.w + x; }
  get(x, y) {
    if (x < 0 || x >= this.w) return T.BEDROCK;
    if (y < 0) return T.AIR;
    if (y >= this.h) return T.AIR;         // below the world = the void
    return this.tiles[y * this.w + x];
  }
  set(x, y, t) {
    if (x < 0 || x >= this.w || y < 0 || y >= this.h) return;
    this.tiles[y * this.w + x] = t;
  }
  solidAt(x, y) { return isSolid(this.get(x, y)); }
  fill(x0, y0, x1, y1, t) {
    for (let y = Math.max(0, y0); y <= Math.min(this.h - 1, y1); y++)
      for (let x = Math.max(0, x0); x <= Math.min(this.w - 1, x1); x++)
        this.tiles[y * this.w + x] = t;
  }
  /* first solid tile at or below y, returns tile-y of the surface */
  groundBelow(x, y) {
    for (let yy = Math.max(0, y | 0); yy < this.h; yy++) if (this.solidAt(x, yy)) return yy;
    return this.h;
  }
}

/* ------------------------------------------------------------------------ */
function generateLevel(index) {
  const cfg = LEVELS[index];
  const w = new World(cfg, index);
  const rnd = mulberry32(cfg.seed);
  switch (cfg.biome) {
    case 'plains': genPlains(w, rnd); break;
    case 'cave': genCave(w, rnd); break;
    case 'desert': genDesert(w, rnd); break;
    case 'volcanic': genVolcanic(w, rnd); break;
    case 'castle': genCastle(w, rnd); break;
  }
  scatterGems(w, rnd);
  placeRunes(w, rnd);
  placeMobs(w, rnd);
  return w;
}

/* Terrain helper: builds a rolling surface with safe pits. */
function buildSurface(w, rnd, opts) {
  const { base, amp, roughness, top, sub, deep, pitChance, maxPit, safeStart } = opts;
  let hgt = base;
  const heights = new Array(w.w);
  let phase = rnd() * 10;
  for (let x = 0; x < w.w; x++) {
    phase += 0.08 + rnd() * 0.02;
    const wave = Math.sin(phase) * amp + Math.sin(phase * 0.37) * amp * 0.6;
    let target = Math.round(base + wave);
    // step limiter keeps every ledge jumpable
    hgt = clamp(target, hgt - 2, hgt + 2);
    heights[x] = clamp(hgt, 8, w.h - 6);
  }
  // carve pits straight through to the void
  const pits = [];
  for (let x = safeStart; x < w.w - 22;) {
    if (rnd() < pitChance) {
      const pw = 2 + Math.floor(rnd() * (maxPit - 1));
      pits.push([x, x + pw - 1]);
      x += pw + 10 + Math.floor(rnd() * 12);
    } else x += 3;
  }
  for (let x = 0; x < w.w; x++) {
    const gy = heights[x];
    w.surface[x] = gy;
    const inPit = pits.some(p => x >= p[0] && x <= p[1]);
    if (inPit) { w.surface[x] = w.h + 4; continue; }
    w.set(x, gy, top);
    for (let y = gy + 1; y < gy + 5; y++) w.set(x, y, sub);
    for (let y = gy + 5; y < w.h - 1; y++) w.set(x, y, deep);
    w.set(x, w.h - 1, T.BEDROCK);
  }
  // a mid-air stepping stone in every pit wider than 3
  for (const [a, b] of pits) {
    if (b - a >= 3) {
      const mx = Math.floor((a + b) / 2);
      const my = heights[a] - 2;
      for (let x = mx - 1; x <= mx + 1; x++) w.set(x, my, T.PLATFORM);
    }
  }
  return { heights, pits };
}

function makeTree(w, x, gy, rnd) {
  const th = 4 + Math.floor(rnd() * 3);
  for (let i = 1; i <= th; i++) w.set(x, gy - i, T.LOG);
  const cy = gy - th - 1;
  // canopy: narrow at the crown, wide in the middle, narrow underneath
  const rows = [[-2, 1], [-1, 2], [0, 2], [1, 1]];
  for (const [dy, rad] of rows) {
    for (let dx = -rad; dx <= rad; dx++) {
      if (rad === 2 && Math.abs(dx) === 2 && rnd() < 0.35) continue;  // ragged edges
      if (w.get(x + dx, cy + dy) === T.AIR) w.set(x + dx, cy + dy, T.LEAVES);
    }
  }
  if (rnd() < 0.5) w.set(x - 2, cy, T.VINE), w.set(x - 2, cy + 1, T.VINE);
}

/* Sinks a ladder shaft from `top` down to the ground, so tall places are climbable. */
function ladderTo(w, x, topY, bottomY) {
  for (let y = topY; y <= bottomY; y++) if (w.get(x, y) === T.AIR) w.set(x, y, T.LADDER);
}

/* Finds an x near startX where the surface is unbroken across [left..right],
   so secret rooms never get carved into a pit and left hanging in mid-air. */
function findFlat(w, startX, left, right) {
  for (let d = 0; d < w.w; d++) {
    for (const x of [startX + d, startX - d]) {
      if (x < 14 || x > w.w - 22) continue;
      let ok = true;
      for (let i = left; i <= right && ok; i++) if (w.surface[x + i] > w.h) ok = false;
      if (ok) return x;
    }
  }
  return startX;
}

/* Places a hint sign near tile x, nudging clear of any pit. */
function hintAt(w, x, up, text) {
  let tx = clamp(x, 3, w.w - 6);
  for (let d = 0; d < 30 && w.surface[tx] > w.h; d++) tx = clamp(x + d, 3, w.w - 6);
  if (w.surface[tx] > w.h) return;
  w.hints.push({ x: tx * TILE + 8, y: (w.surface[tx] - up) * TILE, text });
}

/* A hidden alcove holding a power item. */
function stashItem(w, x, y, kind, hint) {
  w.itemSpots.push({ x: x * TILE + 2, y: y * TILE, kind });
  if (hint) w.hints.push({ x: x * TILE, y: (y - 3) * TILE, text: hint });
}

/* ---------------------------- PLAINS ------------------------------------ */
function genPlains(w, rnd) {
  const { heights } = buildSurface(w, rnd, {
    base: 30, amp: 3.2, roughness: 1, top: T.GRASS, sub: T.DIRT, deep: T.STONE,
    pitChance: 0.055, maxPit: 4, safeStart: 26,
  });
  w.spawn = { x: 5 * TILE, y: (heights[5] - 3) * TILE };

  for (let x = 8; x < w.w - 14; x++) {
    const gy = w.surface[x];
    if (gy > w.h) continue;
    if (rnd() < 0.10 && w.get(x, gy - 1) === T.AIR) makeTree(w, x, gy, rnd);
    else if (rnd() < 0.12) w.set(x, gy - 1, T.SHRUB);
  }
  // ponds
  for (let i = 0; i < 4; i++) {
    const x = 30 + Math.floor(rnd() * (w.w - 70));
    const gy = w.surface[x];
    if (gy > w.h) continue;
    const r = 3 + Math.floor(rnd() * 3);
    for (let dx = -r; dx <= r; dx++) {
      for (let dy = 0; dy < 3; dy++) {
        if (Math.abs(dx) + dy < r + 1) w.set(x + dx, gy + dy, T.WATER);
      }
    }
  }
  // floating islands with ladders back down
  for (let i = 0; i < 7; i++) {
    const x = 24 + Math.floor(rnd() * (w.w - 60));
    const gy = w.surface[x];
    if (gy > w.h) continue;
    const py = gy - 6 - Math.floor(rnd() * 4);
    const len = 4 + Math.floor(rnd() * 4);
    for (let dx = 0; dx < len; dx++) {
      w.set(x + dx, py, T.GRASS);
      w.set(x + dx, py + 1, T.DIRT);
    }
    if (rnd() < 0.6) ladderTo(w, x + len - 1, py + 2, gy - 1);
    w.gemSpots.push({ x: (x + 1) * TILE, y: (py - 1) * TILE });
    w.gemSpots.push({ x: (x + 2) * TILE, y: (py - 1) * TILE });
  }

  /* --- the earth plant: a spring pours into a cave under the hill ------- */
  const sx = findFlat(w, Math.floor(w.w * 0.62), -10, 3);
  const gy = w.surface[sx];
  w.fill(sx, gy, sx + 1, gy + 7, T.AIR);              // the shaft
  for (let y = gy; y <= gy + 7; y++) w.set(sx + 1, y, T.WATER);   // the waterfall
  ladderTo(w, sx, gy, gy + 7);
  w.fill(sx - 8, gy + 5, sx + 1, gy + 8, T.AIR);      // the chamber
  w.fill(sx - 9, gy + 9, sx + 2, gy + 9, T.STONE);
  w.fill(sx - 9, gy + 4, sx - 9, gy + 8, T.STONE);
  w.set(sx - 8, gy + 4, T.GLOWSTONE);
  w.set(sx - 2, gy + 4, T.GLOWSTONE);
  for (let y = gy + 5; y <= gy + 8; y++) w.set(sx + 1, y, T.WATER);
  stashItem(w, sx - 6, gy + 8, 'earth', null);
  w.gemSpots.push({ x: (sx - 4) * TILE, y: (gy + 7) * TILE });
  w.hints.push({ x: (sx - 1) * TILE, y: (gy - 2) * TILE, text: 'a hole. of course you are going in' });
  w.hints.push({ x: (sx - 6) * TILE, y: (gy + 5) * TILE, text: 'Q = spikes   E = big spike' });

  /* Spaced far enough apart that two signs are never legible at once, and
     staggered in height so they don't sit inside the same tree canopy. */
  hintAt(w, 7, 5, 'Arrows or WASD to move');
  hintAt(w, 19, 7, 'SPACE again in mid-air jumps higher');
  hintAt(w, 32, 5, 'Walk through things to pick them up');
  hintAt(w, 45, 7, 'Hold Q to punch blocks apart');
  hintAt(w, 58, 5, 'Trunks are climbable — press UP');

  placeExit(w);
}

/* ----------------------------- CAVE ------------------------------------- */
function genCave(w, rnd) {
  w.fill(0, 0, w.w - 1, w.h - 1, T.STONE);
  let floor = 34, ceil = 12;
  const floors = new Array(w.w), ceils = new Array(w.w);
  let p1 = rnd() * 6, p2 = rnd() * 6;
  for (let x = 0; x < w.w; x++) {
    p1 += 0.07; p2 += 0.05;
    floor = clamp(Math.round(34 + Math.sin(p1) * 4 + Math.sin(p1 * 0.4) * 2), 24, 40);
    ceil = clamp(Math.round(13 + Math.sin(p2) * 3), 6, 20);
    floors[x] = floor; ceils[x] = ceil;
    w.fill(x, ceil, x, floor - 1, T.AIR);
    w.set(x, floor, T.MOSS);
    w.surface[x] = floor;
    if (rnd() < 0.045) w.set(x, ceil, T.GLOWSTONE);
    if (rnd() < 0.03) w.set(x, ceil + 1, T.VINE), w.set(x, ceil + 2, T.VINE);
    if (rnd() < 0.02) w.set(x, floor - 1, T.COAL);
  }
  w.spawn = { x: 5 * TILE, y: (floors[5] - 3) * TILE };

  // chasms down into the void
  for (let i = 0; i < 5; i++) {
    const x = 34 + Math.floor(rnd() * (w.w - 70));
    const pw = 2 + Math.floor(rnd() * 3);
    for (let dx = 0; dx < pw; dx++) {
      for (let y = floors[x + dx]; y < w.h; y++) w.set(x + dx, y, T.AIR);
      w.surface[x + dx] = w.h + 4;
    }
    if (pw >= 3) {
      const mx = x + (pw >> 1);
      w.fill(mx - 1, floors[x] - 3, mx + 1, floors[x] - 3, T.PLATFORM);
    }
  }
  // stalactite/stalagmite pairs + ledges
  for (let i = 0; i < 40; i++) {
    const x = 12 + Math.floor(rnd() * (w.w - 30));
    if (w.surface[x] > w.h) continue;
    const c = ceils[x];
    const len = 1 + Math.floor(rnd() * 3);
    for (let d = 0; d < len; d++) w.set(x, c + 1 + d, T.STONE);
    if (rnd() < 0.3) w.set(x, w.surface[x] - 1, T.SPIKES);
  }
  for (let i = 0; i < 14; i++) {
    const x = 20 + Math.floor(rnd() * (w.w - 50));
    const y = clamp(ceils[x] + 4 + Math.floor(rnd() * 6), 8, 30);
    const len = 3 + Math.floor(rnd() * 4);
    w.fill(x, y, x + len, y, T.PLATFORM);
    w.gemSpots.push({ x: (x + 1) * TILE, y: (y - 1) * TILE });
  }
  // lava at the bottom of a few dips
  for (let i = 0; i < 5; i++) {
    const x = 30 + Math.floor(rnd() * (w.w - 70));
    if (w.surface[x] > w.h) continue;
    const r = 2 + Math.floor(rnd() * 3);
    for (let dx = -r; dx <= r; dx++) {
      const gx = x + dx;
      if (w.surface[gx] > w.h) continue;
      w.set(gx, w.surface[gx], T.LAVA);
    }
  }

  /* --- water mushroom: past a flooded chamber --------------------------- */
  const sx = findFlat(w, Math.floor(w.w * 0.55), -9, 9);
  const fy = w.surface[sx] > w.h ? 34 : w.surface[sx];
  w.fill(sx - 8, fy - 8, sx + 8, fy + 4, T.AIR);
  w.fill(sx - 8, fy + 5, sx + 8, fy + 5, T.STONE);
  w.fill(sx - 6, fy - 1, sx + 6, fy + 4, T.WATER);
  w.fill(sx + 7, fy - 8, sx + 8, fy - 3, T.STONE);
  w.set(sx - 9, fy - 9, T.GLOWSTONE);
  ladderTo(w, sx + 6, fy - 8, fy + 3);
  stashItem(w, sx + 5, fy - 8, 'water', null);
  w.hints.push({ x: (sx + 2) * TILE, y: (fy - 11) * TILE, text: 'Q = blind   E = freeze' });

  placeExit(w);
}

/* ---------------------------- DESERT ------------------------------------ */
function genDesert(w, rnd) {
  const { heights } = buildSurface(w, rnd, {
    base: 31, amp: 4.5, roughness: 1, top: T.SAND, sub: T.SAND, deep: T.SANDSTONE,
    pitChance: 0.06, maxPit: 4, safeStart: 24,
  });
  w.spawn = { x: 5 * TILE, y: (heights[5] - 3) * TILE };

  for (let x = 8; x < w.w - 12; x++) {
    const gy = w.surface[x];
    if (gy > w.h) continue;
    if (rnd() < 0.05) {
      const ch = 2 + Math.floor(rnd() * 2);
      for (let i = 1; i <= ch; i++) w.set(x, gy - i, T.CACTUS);
    }
  }
  // buried sandstone ruins
  for (let i = 0; i < 6; i++) {
    const x = 22 + Math.floor(rnd() * (w.w - 55));
    const gy = w.surface[x];
    if (gy > w.h) continue;
    const hgt = 4 + Math.floor(rnd() * 4), wid = 5 + Math.floor(rnd() * 4);
    w.fill(x, gy - hgt, x + wid, gy - hgt, T.SANDSTONE);
    w.fill(x, gy - hgt + 1, x, gy - 1, T.SANDSTONE);
    w.fill(x + wid, gy - hgt + 1, x + wid, gy - 1, T.SANDSTONE);
    w.fill(x + 1, gy - hgt + 1, x + wid - 1, gy - 1, T.AIR);
    // doorways both sides — a ruin is scenery to walk through, not a dead end.
    // Carve relative to each wall column's own ground, since the dunes slope.
    for (const dx of [0, wid]) {
      const cx = x + dx, cgy = w.surface[cx];
      if (cgy > w.h) continue;
      w.fill(cx, cgy - 3, cx, cgy - 1, T.AIR);
    }
    ladderTo(w, x + wid - 1, gy - hgt + 1, gy - 1);
    w.gemSpots.push({ x: (x + 2) * TILE, y: (gy - hgt - 1) * TILE });
    if (rnd() < 0.5) w.set(x + 2, gy - 1, T.SPIKES);
  }
  // quicksand-looking pools (water tinted by biome render)
  for (let i = 0; i < 3; i++) {
    const x = 30 + Math.floor(rnd() * (w.w - 70));
    const gy = w.surface[x];
    if (gy > w.h) continue;
    for (let dx = -3; dx <= 3; dx++) for (let dy = 0; dy < 3; dy++) w.set(x + dx, gy + dy, T.WATER);
  }

  /* --- electric plant: top of the tallest dune -------------------------- */
  let best = 20, bestY = 99;
  for (let x = 40; x < w.w - 30; x++) if (w.surface[x] < bestY) { bestY = w.surface[x]; best = x; }
  const ty = bestY - 9;
  w.fill(best - 3, ty, best + 3, ty, T.SANDSTONE);
  w.fill(best - 3, ty + 1, best - 3, ty + 3, T.SANDSTONE);
  w.fill(best + 3, ty + 1, best + 3, ty + 3, T.SANDSTONE);
  ladderTo(w, best + 2, ty + 1, bestY - 1);
  ladderTo(w, best + 2, bestY - 1, bestY - 1);
  stashItem(w, best, ty - 1, 'electric', null);
  w.hints.push({ x: (best - 4) * TILE, y: (ty - 4) * TILE, text: 'Q = zap   E = sky boost' });

  placeExit(w);
}

/* --------------------------- VOLCANIC ----------------------------------- */
function genVolcanic(w, rnd) {
  const { heights } = buildSurface(w, rnd, {
    base: 30, amp: 3.6, roughness: 1, top: T.NETHERROCK, sub: T.NETHERROCK, deep: T.OBSIDIAN,
    pitChance: 0.05, maxPit: 4, safeStart: 24,
  });
  w.spawn = { x: 5 * TILE, y: (heights[5] - 3) * TILE };

  for (let x = 10; x < w.w - 12; x++) {
    const gy = w.surface[x];
    if (gy > w.h) continue;
    if (rnd() < 0.05) w.set(x, gy, T.GLOWSTONE);
    if (rnd() < 0.04) w.set(x, gy - 1, T.SPIKES);
  }
  // magma seas: shallow basins you hop across on obsidian stepping stones
  for (let i = 0; i < 8; i++) {
    const x = 26 + Math.floor(rnd() * (w.w - 60));
    if (w.surface[x] > w.h) continue;
    const r = 2 + Math.floor(rnd() * 3);
    for (let dx = -r; dx <= r; dx++) {
      const gx = x + dx;
      if (gx < 1 || gx >= w.w - 1 || w.surface[gx] > w.h) continue;
      w.set(gx, w.surface[gx], T.LAVA);
    }
    for (let dx = -r + 1; dx < r; dx += 2) {
      const gx = x + dx;
      if (w.surface[gx] > w.h) continue;
      w.set(gx, w.surface[gx] - 2, T.OBSIDIAN);
    }
  }
  // basalt columns + platforms above the lava
  for (let i = 0; i < 16; i++) {
    const x = 20 + Math.floor(rnd() * (w.w - 45));
    if (w.surface[x] > w.h) continue;
    const y = w.surface[x] - 5 - Math.floor(rnd() * 5);
    const len = 3 + Math.floor(rnd() * 3);
    w.fill(x, y, x + len, y, T.PLATFORM);
    w.gemSpots.push({ x: (x + 1) * TILE, y: (y - 1) * TILE });
  }

  /* --- lava mushroom: an obsidian island over the magma sea ------------- */
  const sx = findFlat(w, Math.floor(w.w * 0.58), -8, 8);
  const gy = w.surface[sx];
  w.fill(sx - 7, gy - 6, sx + 7, gy - 1, T.AIR);
  w.fill(sx - 7, gy, sx + 7, gy + 1, T.LAVA);
  w.fill(sx - 2, gy - 3, sx + 2, gy - 3, T.OBSIDIAN);
  w.fill(sx - 7, gy - 5, sx - 5, gy - 5, T.PLATFORM);
  w.fill(sx + 5, gy - 5, sx + 7, gy - 5, T.PLATFORM);
  stashItem(w, sx, gy - 4, 'lava', null);
  w.gemSpots.push({ x: (sx - 1) * TILE, y: (gy - 5) * TILE });
  w.hints.push({ x: (sx - 3) * TILE, y: (gy - 8) * TILE, text: 'Q = magma ball   E = eruption' });

  placeExit(w);
}

/* ---------------------------- CASTLE ------------------------------------ */
function genCastle(w, rnd) {
  const { heights } = buildSurface(w, rnd, {
    base: 32, amp: 2.0, roughness: 1, top: T.STONE, sub: T.STONE, deep: T.DARKBRICK,
    pitChance: 0.05, maxPit: 4, safeStart: 22,
  });
  w.spawn = { x: 5 * TILE, y: (heights[5] - 3) * TILE };

  for (let x = 10; x < w.w - 90; x++) {
    const gy = w.surface[x];
    if (gy > w.h) continue;
    if (rnd() < 0.08) w.set(x, gy - 1, T.SHRUB);
    if (rnd() < 0.03) w.set(x, gy - 1, T.SPIKES);
  }
  for (let i = 0; i < 8; i++) {
    const x = 18 + Math.floor(rnd() * (w.w - 120));
    if (w.surface[x] > w.h) continue;
    const y = w.surface[x] - 5 - Math.floor(rnd() * 4);
    w.fill(x, y, x + 3, y, T.PLATFORM);
    w.gemSpots.push({ x: (x + 1) * TILE, y: (y - 1) * TILE });
  }

  /* ---- THE KEEP ---- */
  const x0 = w.w - 78, x1 = w.w - 12;
  let g = 0;
  for (let x = x0; x <= x1; x++) g = Math.max(g, w.surface[x] > w.h ? 32 : w.surface[x]);
  // level the ground under the keep, and pave a clear approach so no pit can
  // strand you outside the walls
  for (let x = x0 - 12; x <= x1 + 4; x++) {
    for (let y = g; y < w.h - 1; y++) w.set(x, y, T.DARKBRICK);
    for (let y = 6; y < g; y++) w.set(x, y, T.AIR);
    w.surface[x] = g;
    w.set(x, g, T.BRICK);
  }
  const topY = g - 26;
  // outer walls
  w.fill(x0, topY, x0 + 1, g - 1, T.BRICK);
  w.fill(x1 - 1, topY, x1, g - 1, T.BRICK);
  // battlements
  for (let x = x0; x <= x1; x += 2) w.set(x, topY - 1, T.BRICK);
  w.fill(x0, topY, x1, topY, T.BRICK);
  // towers
  for (const tx of [x0 - 3, x1 + 1]) {
    w.fill(tx, topY - 5, tx + 2, g - 1, T.BRICK);
    w.fill(tx + 1, topY - 4, tx + 1, g - 2, T.AIR);
    ladderTo(w, tx + 1, topY - 4, g - 2);
    for (let x = tx; x <= tx + 2; x += 2) w.set(x, topY - 6, T.BRICK);
  }
  // the gate — without this the keep is simply unenterable
  w.fill(x0 - 3, g - 3, x0 + 1, g - 1, T.AIR);
  w.set(x0 - 4, g - 3, T.TORCHWALL);
  w.hints.push({ x: (x0 - 6) * TILE, y: (g - 5) * TILE, text: 'the gate stands open' });

  // interior floors
  const f1 = g - 8, f2 = g - 17;
  w.fill(x0 + 2, f1, x1 - 2, f1, T.BRICK);
  w.fill(x0 + 2, f2, x1 - 2, f2, T.BRICK);
  // stairwell gaps + ladders
  w.fill(x0 + 5, f1, x0 + 7, f1, T.AIR);
  ladderTo(w, x0 + 6, f1 - 7, g - 1);
  w.fill(x1 - 7, f2, x1 - 5, f2, T.AIR);
  ladderTo(w, x1 - 6, f2 - 8, f1 - 1);
  // torches + windows
  for (let x = x0 + 3; x < x1 - 2; x += 6) {
    w.set(x, f1 - 3, T.TORCHWALL); w.set(x, f2 - 3, T.TORCHWALL);
  }
  w.set(x0, f1 - 4, T.GLASS); w.set(x0, f2 - 4, T.GLASS);
  w.set(x1, f1 - 4, T.GLASS); w.set(x1, f2 - 4, T.GLASS);
  // guards' furniture
  for (let i = 0; i < 6; i++) {
    const x = x0 + 4 + Math.floor(rnd() * (x1 - x0 - 8));
    w.set(x, f1 - 1, T.PLANK);
    if (rnd() < 0.5) w.set(x + 1, f2 - 1, T.PLANK);
  }

  /* ---- THE SEALED HEART: wind plant ----
     A windowless box standing on the top floor. No door. The only way in is the
     single wooden plank in its roof: stand on top, hold DOWN and press SPACE. */
  const cx = Math.floor((x0 + x1) / 2);
  const cy = f2 - 1;                        // chamber floor sits on the top floor slab
  w.fill(cx - 4, cy - 4, cx + 4, cy, T.DARKBRICK);
  w.fill(cx - 3, cy - 3, cx + 3, cy - 1, T.AIR);
  w.set(cx - 4, cy - 4, T.GLOWSTONE);
  w.set(cx + 4, cy - 4, T.GLOWSTONE);
  w.set(cx, cy - 4, T.PLATFORM);            // <- the way in, and the way out
  ladderTo(w, cx, cy - 3, cy - 1);
  // a fair way up onto the roof of the box
  w.fill(cx - 7, cy - 2, cx - 6, cy - 2, T.PLATFORM);
  w.fill(cx + 6, cy - 2, cx + 7, cy - 2, T.PLATFORM);
  stashItem(w, cx, cy - 1, 'wind', null);
  w.hints.push({ x: (cx - 6) * TILE, y: (cy - 6) * TILE, text: 'DOWN + SPACE drops through wood' });
  w.hints.push({ x: (cx + 7) * TILE, y: (cy - 6) * TILE, text: 'something is sealed in there' });
  w.gemSpots.push({ x: (cx - 2) * TILE, y: (cy - 2) * TILE });
  w.gemSpots.push({ x: (cx + 2) * TILE, y: (cy - 2) * TILE });

  // exit: golden door on the roof, reached by a ladder punched through the ceiling
  w.exit = { x: (x1 - 4) * TILE, y: (topY - 3) * TILE };
  w.fill(x1 - 6, topY - 1, x1 - 2, topY - 1, T.GOLD);
  w.set(x1 - 4, topY - 2, T.DOOR); w.set(x1 - 4, topY - 3, T.DOOR);
  for (let y = f2 - 1; y >= topY - 1; y--) w.set(x1 - 3, y, T.LADDER);
  w.hints.push({ x: (x1 - 3) * TILE, y: (f2 - 4) * TILE, text: 'UP to climb' });
}

/* ------------------------------------------------------------------------ */
function placeExit(w) {
  let x = w.w - 8;
  while (x > 10 && w.surface[x] > w.h) x--;
  const gy = w.surface[x];
  w.exit = { x: x * TILE, y: (gy - 2) * TILE };
  w.fill(x - 2, gy - 1, x + 2, gy - 1, T.GOLD);
  w.set(x, gy - 2, T.DOOR); w.set(x, gy - 3, T.DOOR);
  for (let i = 0; i < 3; i++) w.gemSpots.push({ x: (x - 3 + i) * TILE, y: (gy - 3) * TILE });
}

function scatterGems(w, rnd) {
  // gems trace the walkable path — collecting them drives the perfect-square bonuses
  for (let x = 12; x < w.w - 10; x += 3) {
    if (w.surface[x] > w.h) continue;
    if (rnd() < 0.42) {
      const gy = w.surface[x];
      w.gemSpots.push({ x: x * TILE + 2, y: (gy - 1) * TILE - 4 });
    }
  }
  // arcs of gems over pits, Mario-style
  for (let x = 14; x < w.w - 14; x++) {
    if (w.surface[x] <= w.h || w.surface[x - 1] > w.h) continue;
    const gy = w.surface[x - 1];
    for (let i = 0; i < 5; i++) {
      w.gemSpots.push({ x: (x + i) * TILE + 2, y: (gy - 3 - Math.round(Math.sin(i / 4 * Math.PI) * 2)) * TILE });
    }
  }
}

const RUNE_KINDS = ['oneup', 'ability', 'gems'];
function placeRunes(w, rnd) {
  const count = 3;
  for (let i = 0; i < count; i++) {
    const frac = 0.22 + i * 0.26;
    let x = Math.floor(w.w * frac);
    let tries = 0;
    while ((w.surface[x] > w.h || w.get(x, w.surface[x] - 1) !== T.AIR) && tries++ < 40) x++;
    if (w.surface[x] > w.h) continue;
    const y = w.surface[x] - 4;
    w.runeSpots.push({ x: x * TILE + 2, y: y * TILE, kind: RUNE_KINDS[i % RUNE_KINDS.length] });
  }
}

function placeMobs(w, rnd) {
  const kinds = w.cfg.mobs;
  const spacing = w.biome === 'castle' ? 9 : 11;
  for (let x = 26; x < w.w - 16; x += spacing) {
    const jitter = Math.floor(rnd() * 5) - 2;
    const gx = clamp(x + jitter, 12, w.w - 14);
    const gy = w.surface[gx];
    if (gy > w.h) continue;
    if (!isSolid(w.get(gx, gy))) continue;
    const type = kinds[Math.floor(rnd() * kinds.length)];
    const y = type === 'batty' ? (gy - 7) * TILE : (gy - 2) * TILE;
    w.mobSpots.push({ x: gx * TILE, y, type });
  }
}
/* ==========================================================================
   ENTITIES — Jay, mobs, pickups, projectiles, particles, tile collision
   ========================================================================== */

const initialLang = loadLang();
const G = {
  world: null, player: null,
  /* gemEnts = the pickups lying in the level.  G.gems = how many Jay has counted. */
  mobs: [], items: [], gemEnts: [], runes: [], shots: [], hazards: [], parts: [], pops: [],
  cam: { x: 0, y: 0, shake: 0 },
  state: 'title',              // title | play | rune | glitch | dead | levelclear | win
  level: 0, gems: 0, lives: 3, score: 0,
  abilities: new Set(),
  squaresFound: new Set(),
  time: 0, levelTime: 0,
  banner: null,                // {text, sub, t, color}
  rune: null,
  glitch: null,
  flash: 0, hitStop: 0,
  spawnPoint: { x: 0, y: 0 },
  runsCompleted: 0,
  immortal: false,   // the 144 code. Deliberately NOT reset by startRun().
  codeBuf: '',
  lang: initialLang,           // en | es | de — cycled with L, persisted to localStorage
  langPickT: 0,                // title screen: seconds left showing "you selected X"
  langShown: initialLang !== 'en',  // has the corner language badge earned its place yet?
};

/* `to` is an optional {x, y} in view space. Given one, the banner does not fade
   where it stands — it shrinks and glides into that point, which is the HUD spot
   the prize it just announced will live at from now on. */
function say(text, sub = '', color = '#ffe9a8', dur = 2.6, to = null) {
  G.banner = { text, sub, t: dur, max: dur, color, to };
}

/* --------------------------- collision ---------------------------------- */
function tileRange(e) {
  return {
    x0: Math.floor(e.x / TILE),
    x1: Math.floor((e.x + e.w - 0.001) / TILE),
    y0: Math.floor(e.y / TILE),
    y1: Math.floor((e.y + e.h - 0.001) / TILE),
  };
}

function moveX(e, dx) {
  e.x += dx;
  if (e.noclip) return;
  const W = G.world, r = tileRange(e);
  for (let y = r.y0; y <= r.y1; y++) {
    for (let x = r.x0; x <= r.x1; x++) {
      if (!isSolid(W.get(x, y))) continue;
      if (dx > 0) { e.x = x * TILE - e.w; e.hitWall = 1; }
      else if (dx < 0) { e.x = (x + 1) * TILE; e.hitWall = -1; }
      e.vx = 0;
      return;
    }
  }
}

function moveY(e, dy) {
  const prevBottom = e.y + e.h;
  e.y += dy;
  if (e.noclip) return;
  const W = G.world, r = tileRange(e);
  for (let y = r.y0; y <= r.y1; y++) {
    for (let x = r.x0; x <= r.x1; x++) {
      const t = W.get(x, y);
      if (isPlatform(t)) {
        if (dy > 0 && !e.dropTimer && prevBottom <= y * TILE + 1.5) {
          e.y = y * TILE - e.h; e.vy = 0; e.onGround = true; e.landed = true;
          return;
        }
        continue;
      }
      if (!isSolid(t)) continue;
      if (dy > 0) { e.y = y * TILE - e.h; e.onGround = true; e.landed = true; }
      else if (dy < 0) { e.y = (y + 1) * TILE; e.bonkedHead = true; }
      e.vy = 0;
      return;
    }
  }
}

/* Any tile of interest overlapping the box. */
function scanTiles(e) {
  const W = G.world, r = tileRange(e);
  let climb = false, liquidWater = false, hazard = 0, onPlatform = false;
  for (let y = r.y0; y <= r.y1; y++) {
    for (let x = r.x0; x <= r.x1; x++) {
      const t = W.get(x, y), d = TILEDEF[t];
      if (!d) continue;
      if (d.climb) climb = true;
      if (t === T.WATER) liquidWater = true;
      if (d.hazard > hazard) hazard = d.hazard;
      if (d.platform) onPlatform = true;
    }
  }
  return { climb, liquidWater, hazard, onPlatform };
}

function groundedOnPlatform(e) {
  const W = G.world;
  const y = Math.floor((e.y + e.h + 1) / TILE);
  const x0 = Math.floor(e.x / TILE), x1 = Math.floor((e.x + e.w - 0.001) / TILE);
  for (let x = x0; x <= x1; x++) if (isPlatform(W.get(x, y))) return true;
  return false;
}

/* ------------------------------ base ------------------------------------ */
class Entity {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.vx = 0; this.vy = 0;
    this.onGround = false; this.dead = false;
    this.facing = 1; this.anim = 0; this.noclip = false;
    this.dropTimer = 0;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  overlaps(o, pad = 0) {
    return this.x < o.x + o.w + pad && this.x + this.w + pad > o.x &&
           this.y < o.y + o.h + pad && this.y + this.h + pad > o.y;
  }
  physics(dt, gravity, maxFall) {
    this.landed = false; this.hitWall = 0; this.bonkedHead = false;
    this.vy = Math.min(this.vy + gravity * dt, maxFall);
    this.onGround = false;
    moveX(this, this.vx * dt);
    moveY(this, this.vy * dt);
    if (this.dropTimer > 0) this.dropTimer -= dt;
  }
}

/* ============================== JAY ====================================== */
class Player extends Entity {
  constructor(x, y) {
    super(x, y, 11, 21);
    this.hp = 3; this.maxHp = 3;
    this.inv = [null, null, null, null, null];
    this.sel = -1;          // bare hands until he actually picks something up
    this.stepTimer = 0;
    this.jumpChain = 0;
    this.coyote = 0; this.buffer = 0;
    this.invuln = 0;
    this.crouch = false;
    this.climbing = false;
    this.inWater = false;
    this.cooldown = 0;
    this.boostTimer = 0;
    this.walkPhase = 0;
    this.blinkTimer = 2;
    this.squarePower = 0;   // charge from the "square" ability
    this.exiting = 0;
    this.mineTarget = null; // {x,y} tile Jay is currently punching
    this.mineProgress = 0;
    this.punchT = 0;        // swing animation timer
    this.powerFiredAt = -99;   // when a plant power was last let off
    this.powerFiredKind = null;
  }

  get barehanded() { return !this.inv[this.sel]; }

  /* slot === -1 means Jay's own hands.
     Selecting an empty slot lands you on your fists rather than on nothing —
     so `sel` is only ever -1 or a slot that genuinely holds a plant, and the
     HUD can never light up two slots or an empty one. */
  selectSlot(slot) {
    SFX.menu();
    if (slot === -1) {
      this.sel = -1;
      say(TR('bare hands'), TR('Q punches blocks apart • E uppercut'), '#f2c79c', 1.6);
      return;
    }
    const it = this.inv[slot];
    if (!it) {
      this.sel = -1;
      say(TRF('slotEmpty', slot + 1), TR('bare hands it is'), '#8d9bb5', 1.4);
      return;
    }
    this.sel = slot;
    say(POWERS[it].name, POWERS[it].blurb, POWERS[it].color, 1.4);
  }

  /* SHIFT walks the ring: hands → each plant you're actually carrying → hands.
     Empty slots are skipped, so cycling never lands on nothing. */
  cycleSlot(dir) {
    const ring = [-1];
    for (let i = 0; i < 5; i++) if (this.inv[i]) ring.push(i);
    if (ring.length === 1) {
      this.sel = -1;
      say(TR('bare hands'), TR('nothing to cycle to yet'), '#8d9bb5', 1.2);
      SFX.menu();
      return;
    }
    let at = ring.indexOf(this.sel);
    if (at === -1) at = 0;
    this.selectSlot(ring[(at + dir + ring.length) % ring.length]);
  }

  /* Walking into a single-block ledge shouldn't stop you dead. If the thing in
     the way is one tile high and there's headroom above it, step up onto it. */
  tryStepUp(dir) {
    const W = G.world;
    const tx = Math.floor((dir > 0 ? this.x + this.w + 1 : this.x - 1) / TILE);
    const footY = Math.floor((this.y + this.h - 1) / TILE);
    if (!isSolid(W.get(tx, footY))) return;
    const rise = (this.y + this.h) - footY * TILE;
    if (rise <= 0 || rise > TILE + 2) return;
    const test = { x: this.x + dir * 2, y: this.y - rise - 1, w: this.w, h: this.h };
    const r = tileRange(test);
    for (let y = r.y0; y <= r.y1; y++)
      for (let x = r.x0; x <= r.x1; x++)
        if (isSolid(W.get(x, y))) return;
    this.y -= rise + 1;
  }

  /* Which block is Jay's fist actually on? Chest height first, then his feet,
     then the block above his head — whichever is soft enough to break. */
  pickMineTarget() {
    const W = G.world, f = this.facing;
    const fx = Math.floor((this.cx + f * (this.w / 2 + 5)) / TILE);
    const rows = [
      Math.floor(this.cy / TILE),
      Math.floor((this.y + this.h - 3) / TILE),
      Math.floor((this.y + 2) / TILE),
    ];
    for (const ry of rows) if (SOFT.has(W.get(fx, ry))) return { x: fx, y: ry };
    const ux = Math.floor(this.cx / TILE), uy = Math.floor((this.y - 3) / TILE);
    if (SOFT.has(W.get(ux, uy))) return { x: ux, y: uy };
    return null;
  }

  updateMining(dt) {
    if (this.punchT > 0) this.punchT -= dt;
    if (!this.barehanded || !Keys.isDown('KeyQ') || G.state !== 'play') {
      this.mineTarget = null; this.mineProgress = 0;
      return;
    }
    const t = this.pickMineTarget();
    if (!t) { this.mineTarget = null; this.mineProgress = 0; return; }
    if (!this.mineTarget || this.mineTarget.x !== t.x || this.mineTarget.y !== t.y) {
      this.mineTarget = t; this.mineProgress = 0;
    }
    // TAB doubles the fist too: twice the digging speed
    this.mineProgress += dt * (IN.doubler() ? 2.2 : 1) / 0.30;
    const d = TILEDEF[G.world.get(t.x, t.y)];
    if (d && Math.random() < 0.3) {
      spawnParticle(t.x * TILE + Math.random() * TILE, t.y * TILE + Math.random() * TILE,
        (Math.random() - 0.5) * 40, -20, d.base, 0.3);
    }
    if (this.mineProgress >= 1) {
      breakBlock(t.x, t.y);
      this.mineTarget = null; this.mineProgress = 0;
    }
  }

  get standH() { return 21; }
  get crouchH() { return 14; }

  update(dt) {
    const W = G.world;
    if (this.invuln > 0) this.invuln -= dt;
    if (this.cooldown > 0) this.cooldown -= dt;
    if (this.boostTimer > 0) this.boostTimer -= dt;
    this.blinkTimer -= dt;
    if (this.blinkTimer < -0.12) this.blinkTimer = 2 + Math.random() * 2.5;
    this.noclip = PHYS.noclip;

    const wasGrounded = this.onGround;   // last frame's result, before physics resets it
    const env = scanTiles(this);
    this.inWater = env.liquidWater;
    this.climbing = false;

    // a selected slot that holds nothing is really just bare hands
    if (this.sel >= 0 && !this.inv[this.sel]) this.sel = -1;

    /* ---- crouch ---- */
    const wantCrouch = IN.down() && this.onGround && !env.climb;
    if (wantCrouch && !this.crouch) { this.y += this.standH - this.crouchH; this.h = this.crouchH; this.crouch = true; }
    else if (!wantCrouch && this.crouch) {
      // only stand if there's headroom
      const test = { x: this.x, y: this.y - (this.standH - this.crouchH), w: this.w, h: this.standH };
      const r = tileRange(test);
      let blocked = false;
      for (let y = r.y0; y <= r.y1 && !blocked; y++)
        for (let x = r.x0; x <= r.x1; x++) if (isSolid(W.get(x, y))) { blocked = true; break; }
      if (!blocked) { this.y -= this.standH - this.crouchH; this.h = this.standH; this.crouch = false; }
    }

    /* ---- horizontal ---- */
    const maxSpd = (this.crouch ? PHYS.crouchMax : PHYS.runMax) * PHYS.speedMul *
                   (this.inWater ? 0.65 : 1) * (G.abilities.has('swift') ? 1.22 : 1);
    const accel = this.onGround ? PHYS.runAccel : PHYS.airAccel;
    let dir = 0;
    if (IN.left()) dir -= 1;
    if (IN.right()) dir += 1;
    if (dir !== 0) {
      this.vx = approach(this.vx, dir * maxSpd, accel * dt);
      this.facing = dir;
      this.walkPhase += dt * (6 + Math.abs(this.vx) * 0.045);
    } else {
      const fr = this.onGround ? PHYS.friction : PHYS.airFriction;
      this.vx = approach(this.vx, 0, fr * dt);
      this.walkPhase = 0;
    }

    /* ---- ladders & vines: UP climbs, DOWN descends ---- */
    if (env.climb && (IN.up() || IN.down() || this.wasClimbing)) {
      this.climbing = true;
      this.wasClimbing = true;
      this.vy = 0;
      if (IN.up()) this.vy = -PHYS.climbSpeed;
      else if (IN.down()) this.vy = PHYS.climbSpeed;
      this.jumpChain = 0;
      this.anim += dt * 6;
    } else {
      this.wasClimbing = false;
    }
    if (!env.climb) this.wasClimbing = false;

    /* ---- jumping: SPACE (and UP when not on a ladder) ---- */
    if (IN.jump() || (IN.upTap() && !env.climb)) this.buffer = PHYS.buffer;
    if (this.buffer > 0) this.buffer -= dt;
    if (this.onGround) { this.coyote = PHYS.coyote; this.jumpChain = 0; }
    else if (this.coyote > 0) this.coyote -= dt;

    if (this.buffer > 0) {
      const grounded = this.onGround || this.coyote > 0 || this.climbing;
      // DOWN + jump on a one-way platform = drop through it
      if (grounded && IN.down() && groundedOnPlatform(this) && !this.climbing) {
        this.dropTimer = 0.22; this.buffer = 0; this.y += 2; this.vy = 30;
        Audio2.blip(200, 0.05, 'triangle', 0.4);
      } else if (grounded || this.jumpChain < PHYS.maxJumpChain) {
        this.jumpChain++;
        // each press in mid-air throws Jay HIGHER than the last
        const power = PHYS.jumpV * (1 + PHYS.jumpChainGain * (this.jumpChain - 1));
        this.vy = this.inWater ? PHYS.waterSwim : power;
        this.coyote = 0; this.buffer = 0; this.wasClimbing = false;
        SFX.jump(this.jumpChain);
        for (let i = 0; i < 3 + this.jumpChain * 2; i++) {
          spawnParticle(this.cx, this.y + this.h, (Math.random() - 0.5) * 60,
            Math.random() * 40, this.jumpChain > 1 ? '#9fd0ff' : '#dfe7f0', 0.3);
        }
        if (this.jumpChain > 1) {
          G.pops.push({ x: this.cx, y: this.y, t: 0.5, text: this.jumpChain + '×', color: '#9fd0ff' });
        }
      }
    }
    // variable jump height
    if (this.vy < 0 && !IN.jumpHeld() && !this.climbing) this.vy += (-this.vy) * PHYS.jumpCut * dt * 60 * 0.16;

    /* ---- gravity / water ---- */
    if (this.climbing) {
      moveX(this, this.vx * dt);
      moveY(this, this.vy * dt);
      this.onGround = false;
      const still = scanTiles(this);
      if (!still.climb) this.wasClimbing = false;
    } else {
      const grav = this.inWater ? PHYS.waterGravity : PHYS.gravity;
      const mf = this.inWater ? PHYS.waterMaxFall : PHYS.maxFall;
      const fallSpeed = this.vy;
      this.physics(dt, grav, mf);
      /* Standing still, gravity re-collides with the floor every single tick, so
         `landed` is true constantly. Only a genuine air→ground transition is a
         landing — otherwise the thud plays at 60Hz and sounds like an engine. */
      const justLanded = this.onGround && !wasGrounded;
      if (justLanded) {
        SFX.land(clamp(fallSpeed / 420, 0, 1));
        this.jumpChain = 0;
        if (PHYS.bounce > 0) this.vy = PHYS.jumpV * PHYS.bounce;
      }
      if (this.onGround && dir !== 0 && this.hitWall === dir && !this.crouch) this.tryStepUp(dir);
    }
    if (this.inWater && IN.up()) this.vy = Math.min(this.vy, PHYS.waterSwim * 0.75);

    /* ---- powers ---- */
    if (IN.primary()) usePower(this, 'Q', IN.doubler());
    if (IN.secondary()) usePower(this, 'E', IN.doubler());
    this.updateMining(dt);
    /* slot keys: top row or number pad, 0 = bare hands */
    for (let n = 0; n <= 5; n++) {
      if (Keys.justPressed('Digit' + n, 'Numpad' + n)) this.selectSlot(n - 1);
    }
    if (IN.cycle()) this.cycleSlot(1);

    /* ---- footsteps: only while actually walking on the ground ---- */
    if (this.onGround && !this.climbing && Math.abs(this.vx) > 22) {
      // pace scales with how fast he's going, so a crouch-shuffle isn't a sprint
      this.stepTimer -= dt * clamp(Math.abs(this.vx) / PHYS.runMax, 0.35, 1.4);
      if (this.stepTimer <= 0) { this.stepTimer = 0.30; SFX.step(); }
    } else {
      this.stepTimer = Math.min(this.stepTimer, 0.07);
    }

    /* ---- hazards & the void ---- */
    if (env.hazard > 0) this.hurt(env.hazard, 0);
    if (this.y > (W.h + 3) * TILE) this.fellInVoid();

    /* ---- exit door ---- */
    const ex = W.exit;
    if (Math.abs(this.cx - (ex.x + 8)) < 14 && Math.abs(this.cy - (ex.y + 8)) < 22) {
      if (G.state === 'play') completeLevel();
    }

    G.spawnSafe = this.onGround && env.hazard === 0 ? { x: this.x, y: this.y } : G.spawnSafe;
  }

  fellInVoid() {
    /* THE SECRET: drop off the world while a power is still going off and the
       game tears. Timing-based rather than "is a projectile still alive",
       because the projectile always hits something on the way down — the old
       version was impossible to trigger on purpose, let alone by accident.
       Once per level, so it stays a discovery instead of a free pass. */
    const firing = G.time - this.powerFiredAt < GLITCH_WINDOW;
    if (firing && !G.glitchUsedHere) {
      G.glitchUsedHere = true;
      openGlitchMenu(this.powerFiredKind);
      return;
    }
    playerDied('the void');
  }

  hurt(amount, knock = 0) {
    if (this.invuln > 0 || G.state !== 'play') return;
    this.hp -= amount;
    this.invuln = 1.25;
    G.flash = 0.18; G.cam.shake = 6;
    SFX.hurt();
    this.vy = -180;
    if (knock) this.vx = knock * 150;
    for (let i = 0; i < 12; i++)
      spawnParticle(this.cx, this.cy, (Math.random() - 0.5) * 200, (Math.random() - 0.8) * 180, '#ff6b6b', 0.5);
    if (this.hp <= 0) playerDied('hit');
  }

  heal(n) {
    this.hp = Math.min(this.maxHp, this.hp + n);
  }

  addItem(kind) {
    if (this.inv.includes(kind)) {
      say(TRF('recharged', POWERS[kind].name), POWERS[kind].blurb, POWERS[kind].color, 2);
      return true;
    }
    const slot = this.inv.indexOf(null);
    if (slot === -1) { say(TR('inventory full'), TR('five is the limit — press 1-5'), '#ff9d6b', 2); return false; }
    this.inv[slot] = kind;
    this.sel = slot;
    SFX.pickup();
    say(TRF('toSlot', POWERS[kind].name, slot + 1), POWERS[kind].blurb, POWERS[kind].color, 3);
    return true;
  }
}

/* ============================ PICKUPS ==================================== */
class ItemPickup extends Entity {
  constructor(x, y, kind) { super(x, y, 12, 13); this.kind = kind; this.t = Math.random() * 6; }
  update(dt) {
    this.t += dt;
    if (this.overlaps(G.player, 2)) {
      if (G.player.addItem(this.kind)) {
        this.dead = true;
        for (let i = 0; i < 22; i++)
          spawnParticle(this.cx, this.cy, (Math.random() - 0.5) * 220, (Math.random() - 0.5) * 220,
            POWERS[this.kind].color, 0.7);
      }
    }
  }
}

class Gem extends Entity {
  constructor(x, y) { super(x, y, 8, 9); this.t = Math.random() * 6; }
  update(dt) {
    this.t += dt;
    if (this.overlaps(G.player, 3)) {
      this.dead = true;
      collectGem(this.cx, this.cy);
    }
  }
}

class Rune extends Entity {
  constructor(x, y, kind) { super(x, y, 13, 13); this.kind = kind; this.t = Math.random() * 6; this.used = false; this.cool = 0; }
  update(dt) {
    this.t += dt;
    if (this.cool > 0) this.cool -= dt;
    if (!this.used && this.cool <= 0 && this.overlaps(G.player, 2) && G.state === 'play') openRune(this);
  }
}

/* ============================== MOBS ===================================== */
const MOBDEF = {
  slime:     { w: 14, h: 12, hp: 1, hostile: true,  stomp: true,  color: '#5fbf5a', dark: '#3f8f3c', speed: 55 },
  spikeling: { w: 14, h: 14, hp: 2, hostile: true,  stomp: false, color: '#b06fd6', dark: '#7c47a0', speed: 42 },
  batty:     { w: 14, h: 10, hp: 1, hostile: true,  stomp: true,  color: '#7d6a99', dark: '#544667', speed: 66, fly: true },
  guardian:  { w: 14, h: 20, hp: 3, hostile: true,  stomp: false, color: '#c9ced9', dark: '#8e94a3', speed: 30, shoots: true },
  pig:       { w: 16, h: 12, hp: 1, hostile: false, stomp: true,  color: '#f0a5a8', dark: '#c97b80', speed: 26 },
  sheep:     { w: 16, h: 14, hp: 1, hostile: false, stomp: true,  color: '#f2f2f0', dark: '#cfcfcb', speed: 22 },
  chicken:   { w: 11, h: 11, hp: 1, hostile: false, stomp: true,  color: '#fbfbf6', dark: '#d8d8cf', speed: 30 },
};

class Mob extends Entity {
  constructor(x, y, type, friendly) {
    const d = MOBDEF[type];
    super(x, y, d.w, d.h);
    this.type = type; this.d = d;
    this.hp = d.hp;
    this.hostile = friendly === true ? false : d.hostile;
    this.tamed = friendly === true;
    this.dir = Math.random() < 0.5 ? -1 : 1;
    this.timer = Math.random() * 2;
    this.frozen = 0; this.blind = 0; this.burn = 0; this.stun = 0;
    this.baseY = y; this.phase = Math.random() * 7;
    this.shootTimer = 1 + Math.random() * 2;
    this.flash = 0;
  }

  update(dt) {
    const P = G.player;
    if (this.flash > 0) this.flash -= dt;
    if (this.frozen > 0) {
      this.frozen -= dt;
      this.vx = 0;
      if (!this.d.fly) this.physics(dt, PHYS.gravity, PHYS.maxFall);
      return;
    }
    if (this.burn > 0) {
      this.burn -= dt;
      if (Math.random() < 0.4) spawnParticle(this.cx, this.cy, (Math.random() - 0.5) * 40, -40, '#ff9d3a', 0.4);
      this.hurtTick = (this.hurtTick || 0) + dt;
      if (this.hurtTick > 0.5) { this.hurtTick = 0; this.damage(1); }
    }
    if (this.stun > 0) { this.stun -= dt; }
    if (this.blind > 0) this.blind -= dt;

    this.timer -= dt;
    this.phase += dt;
    const distX = P.cx - this.cx, distY = P.cy - this.cy;
    const near = Math.abs(distX) < 190 && Math.abs(distY) < 110;
    const chase = this.hostile && near && this.blind <= 0;

    switch (this.type) {
      case 'slime': {
        if (this.onGround && this.timer <= 0) {
          this.timer = 0.85 + Math.random() * 0.8;
          this.dir = chase ? sign(distX) || 1 : (Math.random() < 0.5 ? -1 : 1);
          this.vy = -215;
          this.vx = this.dir * this.d.speed;
        }
        if (this.onGround) this.vx = approach(this.vx, 0, 400 * dt);
        break;
      }
      case 'spikeling': {
        if (this.stun <= 0) {
          if (chase) this.dir = sign(distX) || this.dir;
          this.vx = this.dir * this.d.speed;
          if (this.hitWall) this.dir *= -1;
          if (this.onGround && !this.groundAhead()) this.dir *= -1;
        }
        break;
      }
      case 'batty': {
        const tx = chase ? P.cx : this.cx + this.dir * 60;
        this.vx = approach(this.vx, sign(tx - this.cx) * this.d.speed, 200 * dt);
        this.vy = Math.sin(this.phase * 3) * 40 + (chase ? sign(P.cy - this.cy) * 26 : 0);
        if (this.hitWall) this.dir *= -1;
        break;
      }
      case 'guardian': {
        if (this.stun <= 0) {
          this.dir = chase ? (sign(distX) || this.dir) : this.dir;
          this.vx = this.dir * this.d.speed * (chase ? 1 : 0.5);
          if (this.hitWall) this.dir *= -1;
          if (this.onGround && !this.groundAhead()) this.dir *= -1;
        }
        this.shootTimer -= dt;
        if (chase && this.shootTimer <= 0) {
          this.shootTimer = 2.0;
          const s = new Shot(this.cx, this.cy - 2, sign(distX) * 105, -20, 'orb', false);
          s.hostile = true; G.shots.push(s);
          Audio2.blip(300, 0.1, 'sawtooth', 0.5, -120);
        }
        break;
      }
      default: { // passive animals
        if (this.timer <= 0) {
          this.timer = 1.2 + Math.random() * 2.4;
          this.dir = Math.random() < 0.5 ? -1 : (Math.random() < 0.5 ? 0 : 1);
          if (this.onGround && Math.random() < 0.25) this.vy = -150;
        }
        this.vx = approach(this.vx, this.dir * this.d.speed, 300 * dt);
        if (this.hitWall) this.dir *= -1;
        if (this.onGround && this.dir !== 0 && !this.groundAhead()) this.dir *= -1;
        break;
      }
    }

    if (this.d.fly) {
      this.landed = false; this.hitWall = 0;
      moveX(this, this.vx * dt);
      moveY(this, this.vy * dt);
    } else {
      this.physics(dt, PHYS.gravity, PHYS.maxFall);
    }
    if (this.vx !== 0) this.facing = sign(this.vx);

    const env = scanTiles(this);
    if (env.hazard > 0 && this.type !== 'slime') this.damage(1);
    if (this.y > (G.world.h + 2) * TILE) this.dead = true;

    /* contact with Jay */
    if (this.overlaps(P, 0) && G.state === 'play') {
      const stomping = P.vy > 40 && (P.y + P.h) - this.y < 12;
      if (stomping && this.d.stomp) {
        this.damage(99, true);
        P.vy = IN.jumpHeld() ? -300 : -210;
        P.jumpChain = Math.max(0, P.jumpChain - 1);
        SFX.stomp();
      } else if (this.hostile) {
        P.hurt(1, sign(P.cx - this.cx));
      }
    }
  }

  groundAhead() {
    const W = G.world;
    const fx = Math.floor((this.cx + this.dir * (this.w * 0.6 + 2)) / TILE);
    const fy = Math.floor((this.y + this.h + 2) / TILE);
    return isSolid(W.get(fx, fy)) || isPlatform(W.get(fx, fy));
  }

  knock(dx, power = 220) {
    this.vx = dx * power;
    this.vy = -140;
    this.stun = 0.5;
  }

  damage(n, stomped) {
    if (this.dead) return;
    this.hp -= n;
    this.flash = 0.12;
    if (this.hp > 0) { Audio2.blip(240, 0.05, 'square', 0.4); return; }
    this.dead = true;
    if (this.hostile) { G.score += 100; }
    for (let i = 0; i < 16; i++)
      spawnParticle(this.cx, this.cy, (Math.random() - 0.5) * 220, (Math.random() - 0.7) * 200,
        this.d.color, 0.6);
    if (!stomped) Audio2.blip(180, 0.1, 'square', 0.5, -100);
    // defeat a square number of foes (1, 4, 9, 16…) and one drops a gem
    G.kills = (G.kills || 0) + 1;
    if (isPerfectSquare(G.kills) && G.kills > 1) {
      const g = new Gem(this.cx - 4, this.cy - 4); g.vy = -60; G.gemEnts.push(g);
      G.pops.push({ x: this.cx, y: this.cy - 10, t: 1.2, text: '√' + G.kills + ' = ' + Math.sqrt(G.kills), color: '#9ff0c0' });
      SFX.square();
    }
  }
}

/* =========================== PROJECTILES ================================= */
class Shot extends Entity {
  constructor(x, y, vx, vy, kind, doubled) {
    super(x - 4, y - 4, 8, 8);
    this.vx = vx; this.vy = vy; this.kind = kind;
    this.life = 2.4; this.doubled = !!doubled;
    this.grav = 0; this.hostile = false; this.pierce = false;
    this.t = 0;
    const k = SHOTDEF[kind] || {};
    Object.assign(this, k);
  }
  update(dt) {
    this.t += dt;
    this.life -= dt;
    if (this.life <= 0) { this.expire(); return; }
    this.hitWall = 0;
    moveX(this, this.vx * dt);
    if (this.hitWall) { this.onImpact(); return; }
    this.vy += this.grav * dt;
    moveY(this, this.vy * dt);
    if (this.onGround || this.bonkedHead) { this.onImpact(); return; }
    if (this.y > (G.world.h + 2) * TILE) { this.dead = true; return; }

    if (this.trail) {
      if (Math.random() < 0.7) spawnParticle(this.cx, this.cy, (Math.random() - 0.5) * 40,
        (Math.random() - 0.5) * 40, this.trail, 0.3);
    }

    if (this.hostile) {
      if (this.overlaps(G.player)) { G.player.hurt(1, sign(this.vx)); this.dead = true; }
      return;
    }
    for (const m of G.mobs) {
      if (m.dead || m.tamed) continue;
      if (!this.overlaps(m)) continue;
      this.hitMob(m);
      if (!this.pierce) { this.onImpact(); return; }
    }
  }
  hitMob(m) {
    switch (this.kind) {
      case 'wind':
        m.knock(sign(this.vx), this.doubled ? 340 : 230);
        m.damage(this.doubled ? 1 : 0.5);
        break;
      case 'windorb':
        m.knock(sign(this.vx), 300); m.damage(1);
        break;
      case 'magma':
        m.burn = 2.2; m.damage(2); break;
      case 'eruption':
        m.burn = 3; m.damage(2); break;
      case 'water':
        m.blind = 4; m.damage(0.5);
        G.pops.push({ x: m.cx, y: m.y - 6, t: 0.8, text: TR('blind!'), color: '#8fd3ff' });
        break;
      case 'ice':
        m.frozen = 4.5; m.vx = 0;
        G.pops.push({ x: m.cx, y: m.y - 6, t: 0.8, text: TR('frozen!'), color: '#bff0ff' });
        break;
      case 'orb':
        break;
      default: m.damage(1);
    }
  }
  onImpact() {
    switch (this.kind) {
      case 'magma':
        boom(this.cx, this.cy, 26, '#ff8a3a', 1);
        break;
      case 'eruption':
        boom(this.cx, this.cy, 44, '#ff6a2a', 2);
        G.hazards.push(new LavaPool(this.cx - 22, this.cy - 4, 44));
        G.cam.shake = 8;
        SFX.boom();
        break;
      case 'ice':
        for (let i = 0; i < 10; i++) spawnParticle(this.cx, this.cy, (Math.random() - .5) * 160, (Math.random() - .5) * 160, '#bff0ff', .5);
        break;
      case 'water':
        for (let i = 0; i < 8; i++) spawnParticle(this.cx, this.cy, (Math.random() - .5) * 120, (Math.random() - .5) * 120, '#6fb2ff', .4);
        break;
      case 'wind': case 'windorb':
        for (let i = 0; i < 6; i++) spawnParticle(this.cx, this.cy, (Math.random() - .5) * 200, (Math.random() - .5) * 60, '#e6f4ff', .35);
        break;
    }
    this.dead = true;
  }
  expire() { this.onImpact(); }
}

const SHOTDEF = {
  wind:     { life: 0.55, grav: 0, trail: '#dff0ff', pierce: true },
  windorb:  { life: 1.5, grav: 220, trail: '#cfe8ff' },
  magma:    { life: 2.6, grav: 520, trail: '#ff9a3a' },
  eruption: { life: 2.6, grav: 480, trail: '#ff7020' },
  water:    { life: 1.4, grav: 380, trail: '#66aaff' },
  ice:      { life: 1.6, grav: 120, trail: '#cdf2ff' },
  orb:      { life: 3.0, grav: 90, trail: '#ffc27a' },
  ray:      { life: 0.16, grav: 0, pierce: true },
};

/* ---- ground hazards / effects ---- */
class LavaPool {
  constructor(x, y, w) { this.x = x; this.y = y; this.w = w; this.h = 6; this.t = 4.5; this.dead = false; }
  update(dt) {
    this.t -= dt;
    if (this.t <= 0) { this.dead = true; return; }
    if (Math.random() < 0.5)
      spawnParticle(this.x + Math.random() * this.w, this.y, (Math.random() - .5) * 30, -50, '#ff9d3a', 0.5);
    const box = { x: this.x, y: this.y, w: this.w, h: this.h };
    for (const m of G.mobs) if (!m.dead && !m.tamed && rectHit(box, m)) { m.burn = 2; m.damage(0.03); }
  }
}

class EarthSpike {
  constructor(x, groundY, big) {
    this.x = x; this.y = groundY; this.big = big;
    this.h = 0; this.maxH = big ? 34 : 20;
    this.t = big ? 1.4 : 0.9; this.dead = false; this.hit = new Set();
  }
  update(dt) {
    this.h = Math.min(this.maxH, this.h + 200 * dt);
    this.t -= dt;
    if (this.t <= 0) { this.dead = true; return; }
    const box = { x: this.x - (this.big ? 9 : 5), y: this.y - this.h, w: this.big ? 18 : 10, h: this.h };
    for (const m of G.mobs) {
      if (m.dead || m.tamed || this.hit.has(m)) continue;
      if (rectHit(box, m)) {
        this.hit.add(m);
        m.damage(this.big ? 99 : 2);
        m.vy = -180;
      }
    }
  }
}

class Ray {
  constructor(x, y, dir, len, doubled) {
    this.x = x; this.y = y; this.dir = dir; this.len = len;
    this.t = 0.22; this.dead = false; this.doubled = doubled;
    const box = { x: dir > 0 ? x : x - len, y: y - 5, w: len, h: 10 };
    this.box = box;
    for (const m of G.mobs) {
      // lightning spares the pigs, sheep and chickens, same as the earth nova
      if (m.dead || m.tamed || !m.hostile) continue;
      if (rectHit(box, m)) { m.damage(doubled ? 4 : 2); m.knock(dir, 140); m.stun = 0.6; }
    }
  }
  update(dt) { this.t -= dt; if (this.t <= 0) this.dead = true; }
}

function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function boom(x, y, radius, color, dmg) {
  G.cam.shake = Math.max(G.cam.shake, radius * 0.18);
  for (let i = 0; i < radius; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * radius * 6;
    spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s - 40, color, 0.6);
  }
  const box = { x: x - radius, y: y - radius, w: radius * 2, h: radius * 2 };
  for (const m of G.mobs) if (!m.dead && !m.tamed && rectHit(box, m)) { m.damage(dmg); m.knock(sign(m.cx - x), 200); }
  SFX.boom();
}

/* Knock a block out of the world. Only SOFT blocks ever get here. */
function breakBlock(x, y) {
  const W = G.world;
  const id = W.get(x, y);
  if (!SOFT.has(id)) return false;
  const d = TILEDEF[id];
  W.set(x, y, T.AIR);
  for (let i = 0; i < 14; i++) {
    spawnParticle(x * TILE + Math.random() * TILE, y * TILE + Math.random() * TILE,
      (Math.random() - 0.5) * 150, -Math.random() * 160, Math.random() < 0.5 ? d.base : d.shade, 0.55);
  }
  Audio2.blip(150 + Math.random() * 60, 0.07, 'square', 0.45, -60);
  Audio2.noise(0.06, 0.2);
  G.score += 5;
  return true;
}

/* Fist swing: hurt anything in a small box in front of Jay. */
function meleeHit(p, reach, up) {
  const box = up
    ? { x: p.cx - 13, y: p.y - 16, w: 26, h: 20 }
    : { x: p.facing > 0 ? p.cx : p.cx - reach, y: p.y + 2, w: reach, h: p.h - 4 };
  let hits = 0;
  for (const m of G.mobs) {
    if (m.dead || m.tamed || !rectHit(box, m)) continue;
    m.damage(1);
    if (up) { m.vy = -260; m.stun = 0.5; } else m.knock(p.facing, 190);
    hits++;
  }
  return hits;
}

/* ---- particles ---- */
function spawnParticle(x, y, vx, vy, color, life) {
  if (G.parts.length > 620) return;
  G.parts.push({ x, y, vx, vy, color, life, max: life, size: 1 + Math.random() * 2 });
}
function updateParticles(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0) { G.parts.splice(i, 1); continue; }
    p.vy += 420 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = G.pops.length - 1; i >= 0; i--) {
    const p = G.pops[i];
    p.t -= dt; p.y -= 22 * dt;
    if (p.t <= 0) G.pops.splice(i, 1);
  }
}

function usePower(p, which, doubled) {
  if (G.state !== 'play') return;
  const kind = p.inv[p.sel];
  if (!kind) {
    if (p.cooldown > 0) return;
    p.cooldown = FIST.cd;
    if (which === 'Q') FIST.q(p, doubled); else FIST.e(p);
    return;
  }
  if (p.cooldown > 0) return;
  const def = POWERS[kind];
  // remembered so that falling into the void just after firing tears the world
  p.powerFiredAt = G.time;
  p.powerFiredKind = kind;
  // the "square" ability makes TAB double the secondary too
  const dbl = which === 'Q' ? doubled : (doubled && G.abilities.has('square'));
  p.cooldown = def.cd * (dbl ? 1.55 : 1);
  if (which === 'Q') def.q(p, dbl);
  else { def.e(p, dbl); if (dbl) setTimeout(() => { if (G.state === 'play') def.e(p, dbl); }, 130); }
  if (dbl) {
    G.pops.push({ x: p.cx, y: p.y - 6, t: 0.8, text: '²', color: def.color });
    G.flash = Math.max(G.flash, 0.06);
  }
}
