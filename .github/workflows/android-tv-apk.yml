name: Build Android TV APK

on:
  pull_request:
    paths:
      - ".github/workflows/android-tv-apk.yml"
      - "android-tv/**"
      - "assets/favicon.*"
      - "build.sh"
      - "docs/title.en.png"
      - "jay-squared.html"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-tv-apk.yml"
      - "android-tv/**"
      - "assets/favicon.*"
      - "build.sh"
      - "docs/title.en.png"
      - "jay-squared.html"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rebuild game HTML
        run: ./build.sh

      - name: Validate and build APK
        working-directory: android-tv
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: jay-squared-tv-debug-${{ github.sha }}
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
